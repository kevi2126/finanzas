<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Mis Finanzas Ruta</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --card2:#1f2630; --line:#2b3340;
  --t1:#f0efec; --t2:#c3c2b7; --t3:#8b8a83;
  --inc:#3987e5; --exp:#d95926;
  --good:#0ca30c; --warn:#fab219; --bad:#d03b3b;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t1);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
header{padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:center;max-width:640px;margin:0 auto}
header h1{font-size:20px;margin:0}
header small{color:var(--t3)}
#hdrRight{display:flex;gap:6px;align-items:center}
#syncBadge{font-size:12px;color:var(--t3);background:none;border:0;padding:4px}
main{padding:8px 12px 20px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card h2{font-size:15px;margin:0 0 10px;color:var(--t2);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px}
.muted{color:var(--t3);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{min-width:0;flex:1}
.row .l>div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card2);border-radius:12px;padding:10px}
.tile .v{font-size:19px;font-weight:700}
.tile .k{font-size:12px;color:var(--t3)}
.pos{color:#5fd35f}.neg{color:#ff7b7b}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.good{background:rgba(12,163,12,.18);color:#5fd35f;border:1px solid var(--good)}
.pill.warn{background:rgba(250,178,25,.15);color:var(--warn);border:1px solid var(--warn)}
.pill.bad{background:rgba(208,59,59,.18);color:#ff7b7b;border:1px solid var(--bad)}
.banner{border-radius:var(--r);padding:14px;margin:10px 0;border:1px solid}
.banner.good{background:rgba(12,163,12,.12);border-color:var(--good)}
.banner.warn{background:rgba(250,178,25,.10);border-color:var(--warn)}
.banner.bad{background:rgba(208,59,59,.14);border-color:var(--bad)}
.banner b{font-size:16px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--inc)}
nav{position:fixed;left:0;right:0;bottom:0;background:#0b0f15;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--t3);padding:8px 0 10px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--t1)}
nav button.add span{background:var(--good);color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-top:-4px}
label{display:block;font-size:13px;color:var(--t2);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--card2);color:var(--t1);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--inc);border-color:transparent}
.btn{display:inline-block;background:var(--card2);color:var(--t1);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;cursor:pointer;text-align:center}
.btn.primary{background:var(--good);border-color:var(--good);color:#fff}
.btn.blue{background:var(--inc);border-color:var(--inc);color:#fff}
.btn.danger{background:transparent;border-color:var(--bad);color:#ff7b7b}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.full{width:100%;margin-top:14px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--t2);padding:9px 4px;border-radius:9px;font-weight:600;font-size:13.5px}
.seg button.on{background:var(--card);color:var(--t1);box-shadow:0 1px 0 var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card2);color:var(--t2);border-radius:999px;padding:7px 12px;font-size:13px}
.chips button.on{background:var(--exp);border-color:var(--exp);color:#fff}
.legend{display:flex;gap:14px;font-size:12px;color:var(--t2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;background:#000;border:1px solid var(--line);color:var(--t1);padding:6px 9px;border-radius:8px;font-size:12px;pointer-events:none;z-index:20;display:none}
dialog{background:var(--card);color:var(--t1);border:1px solid var(--line);border-radius:18px;width:min(92vw,460px);padding:16px;max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.6)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#222a35;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:30;display:none;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--t3);font-weight:600}
tr.paid td{color:var(--t3)}
tr.next td{background:rgba(57,135,229,.12)}
tr.late td{background:rgba(208,59,59,.15)}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--t2)}
.check input{width:20px;height:20px;flex:none}
.hint{font-size:12px;color:var(--t3);margin-top:4px}
.qbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
</style>
</head>
<body>
<header>
  <div><h1 id="title">Inicio</h1><small id="subtitle"></small></div>
  <div id="hdrRight"><button id="syncBadge" data-act="syncNow"></button><span id="hdrPill"></span></div>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-tab="inicio" class="on"><span>🏠</span>Inicio</button>
  <button data-tab="movs"><span>📒</span>Movs</button>
  <button data-tab="deudas"><span>💳</span>Deudas</button>
  <button data-tab="nuevo" class="add"><span>+</span>Registrar</button>
  <button data-tab="auto"><span>🚗</span>Auto</button>
  <button data-tab="apartados"><span>🐷</span>Apartados</button>

<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script src="schedule.js"></script>
<script>
/* ================== DATOS ================== */
const KEY='finanzas_ruta_v1', SKEY='finanzas_ruta_sync';
const SOBRES={
  auto:{n:'Mensualidad auto',e:'🚗'},
  fijos:{n:'TDC y pagos fijos',e:'💳'},
  mant:{n:'Mantenimiento',e:'🔧'},
  imp:{n:'Impuestos (SAT)',e:'🧾'},
  emerg:{n:'Fondo de emergencia',e:'🛟'},
  capital:{n:'Abono extra (deudas/auto)',e:'📉'}
};
const GASTO_CATS={
  gasolina:'⛽ Gasolina', mant:'🔧 Mantenimiento', comida:'🍔 Comida', auto:'🚗 Mensualidad auto',
  seguro:'🛡️ Seguro', servicios:'📱 Servicios/Celular', casa:'🏠 Casa', personal:'🛍️ Personal/Varios',
  intereses:'💸 Intereses/comisiones', otro:'📦 Otro'
};
const DIARIOS=['gasolina','comida','personal','otro','casa'];
const ARR=['entries','moves','prepay','bills','debts'];   // colecciones con id (se sincronizan por registro)
const MAPS=['carPaid','billPaid','weekReal'];
const seedDebts=[['bbva','BBVA Azul'],['rappi','RappiCard'],['nu','Nu'],['klar','Klar'],['stori','Stori'],['ml','Mercado Libre']]
  .map(([id,n])=>({id:'tdc-'+id,name:n,type:'tdc',saldo:0,limite:0,tasa:0,pagoMin:0,pagoNoInt:0,day:0}));
const DEFAULTS={
  settings:{ivaPct:16,retIvaPct:8,retIsrPct:2.1,weekStart:1,maintPct:8,maintGoal:10000,taxPct:0,
            emergPct:10,emergMonths:3,emergMin:5000,abonoPct:50,remindDays:5,strategy:'avalancha',segCancelFrom:0},
  entries:[],   // {id,date,type:'ruta'|'extra'|'gasto'|'pago',cat,amount,km,paq,lts,note,from,card,debt}
  moves:[],     // {id,date,sobre,amount,note,ref}
  carPaid:{}, prepay:[], bills:[], billPaid:{}, weekReal:{},
  debts:seedDebts,
  meta:{}, del:{}  // marcas de tiempo para sincronizar sin perder datos
};
function normalize(s){
  const o=Object.assign(structuredClone(DEFAULTS),s||{});
  o.settings=Object.assign({},DEFAULTS.settings,(s||{}).settings);
  ARR.forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});MAPS.concat(['meta','del']).forEach(k=>{if(!o[k]||typeof o[k]!=='object')o[k]={}});
  return o;
}
const seedBills=[{id:'tel-principal',name:'Teléfono principal',type:'fijo',day:3,amount:135,freq:'n',cada:15,fecha:'2026-12-03',desde:''},
  {id:'tel-trabajo',name:'Teléfono trabajo',type:'fijo',day:15,amount:230,freq:'n',cada:30,fecha:'2026-11-15',desde:'',pausado:true}];
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  const o=normalize(s);
  if(!o.seedTel){seedBills.forEach(b=>{if(!o.bills.some(x=>x.id===b.id)&&!o.del['bills:'+b.id])o.bills.push({...b})});o.seedTel=true}
  if(!o.seedTel2){ // corrige teléfonos: principal cada 15 días desde 3 dic; trabajo en pausa
    seedBills.forEach(sb=>{const b=o.bills.find(x=>x.id===sb.id);if(b){Object.assign(b,sb);o.meta['bills:'+b.id]=Date.now()}});o.seedTel2=true}
  if(!o.seedRet){ // retenciones de ML (IVA 8%, ISR 2.1%) según el corte real
    if(!+o.settings.retIvaPct&&!+o.settings.retIsrPct){o.settings.retIvaPct=8;o.settings.retIsrPct=2.1;o.meta.settings=Date.now()}o.seedRet=true}
  return o}
let S=load();
function save(){localStorage.setItem(KEY,JSON.stringify(S));scheduleSync()}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now=()=>Date.now();
// --- mutaciones con marca de tiempo ---
function add(c,r){S[c].push(r);S.meta[c+':'+r.id]=now();return r}
function upd(c,r){S.meta[c+':'+r.id]=now()}
function rem(c,id){S[c]=S[c].filter(x=>x.id!==id);S.del[c+':'+id]=now()}
function mset(m,k,v){S[m][k]=v;S.meta[m+':'+k]=now()}
function mdel(m,k){delete S[m][k];S.del[m+':'+k]=now()}
// --- fusión de dos copias (iPhone + Android) ---
function merge(a,b){
  a=normalize(a);b=normalize(b);
  const mx=(x,y)=>{const o={...x};for(const k in y)o[k]=Math.max(o[k]||0,y[k]);return o};
  const out=normalize(null);out.meta=mx(a.meta,b.meta);out.del=mx(a.del,b.del);
  const alive=k=>!(out.del[k]&&out.del[k]>=(out.meta[k]||0));
  ARR.forEach(c=>{const m=new Map();[a,b].forEach(src=>src[c].forEach(r=>{const t=src.meta[c+':'+r.id]||0,cur=m.get(r.id);if(!cur||t>cur.t)m.set(r.id,{r,t})}));
    out[c]=[...m.values()].filter(x=>alive(c+':'+x.r.id)).map(x=>x.r)});
  MAPS.forEach(c=>{const o={};const keys=new Set([...Object.keys(a[c]),...Object.keys(b[c])]);
    keys.forEach(k=>{const ta=k in a[c]?(a.meta[c+':'+k]||0):-1,tb=k in b[c]?(b.meta[c+':'+k]||0):-1;const v=ta>=tb?a[c][k]:b[c][k];if(alive(c+':'+k))o[k]=v});out[c]=o});
  out.settings=(a.meta.settings||0)>=(b.meta.settings||0)?a.settings:b.settings;
  return out;
}

/* ================== UTILIDADES ================== */
const fmt=n=>(n<-0.004?'-':'')+'$'+Math.abs(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>(n<-0.5?'-':'')+'$'+Math.round(Math.abs(n||0)).toLocaleString('es-MX');
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d||1)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const daysBetween=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const ym=s=>s.slice(0,7);
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate=s=>{const d=pd(s);return `${d.getDate()} ${MESES[d.getMonth()]} ${d.getFullYear()}`};
const fdateS=s=>{const d=pd(s);return `${['dom','lun','mar','mié','jue','vie','sáb'][d.getDay()]} ${d.getDate()} ${MESES[d.getMonth()]}`};
const fmonth=s=>{const[y,m]=s.split('-').map(Number);return `${MESES[m-1]} ${y}`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
function weekKey(s){const d=pd(s);const diff=(d.getDay()-S.settings.weekStart+7)%7;d.setDate(d.getDate()-diff);return iso(d)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}
const lvl=(v,g,w,hb=true)=>hb?(v>=g?'good':v>=w?'warn':'bad'):(v<=g?'good':v<=w?'warn':'bad');
const LBL={good:'✅ Bien',warn:'⚠️ Atención',bad:'⛔ Mal'};
const pill=(l,t)=>`<span class="pill ${l}">${t||LBL[l]}</span>`;
const worst=(...ls)=>ls.includes('bad')?'bad':ls.includes('warn')?'warn':'good';

/* ================== CÁLCULOS ================== */
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const payFactor=()=>1+(S.settings.ivaPct-S.settings.retIvaPct-S.settings.retIsrPct)/100;
const entryValue=e=>e.type==='ruta'?e.amount*payFactor():e.amount;
const sobreBal=k=>sum(S.moves.filter(m=>m.sobre===k),m=>m.amount);
const isCashOut=e=>(e.type==='gasto'&&!e.card)||e.type==='pago';
function weekData(wk){
  const end=addDays(wk,6),es=S.entries.filter(e=>e.date>=wk&&e.date<=end),rutas=es.filter(e=>e.type==='ruta');
  const sub=r2(sum(rutas,e=>e.amount)),iva=r2(sub*S.settings.ivaPct/100),retIva=r2(sub*S.settings.retIvaPct/100),retIsr=r2(sub*S.settings.retIsrPct/100),ret=retIva+retIsr,esperado=r2(sub+iva-ret); // redondeo por línea, igual que el corte de ML
  const real=S.weekReal[wk],ruta=real!=null&&real!==''?+real:esperado;
  const extras=sum(es.filter(e=>e.type==='extra'),e=>e.amount);
  return {wk,end,sub,iva,retIva,retIsr,ret,esperado,real,ruta,extras,ingreso:ruta+extras,
    gastos:sum(es.filter(e=>e.type==='gasto'),e=>e.amount),
    salidas:sum(es.filter(isCashOut),e=>e.amount),
    diarios:sum(es.filter(e=>e.type==='gasto'&&DIARIOS.includes(e.cat)&&!e.from&&!e.card),e=>e.amount),
    km:sum(rutas,e=>e.km),dias:new Set(rutas.map(e=>e.date)).size};
}
function monthData(m){
  const es=S.entries.filter(e=>ym(e.date)===m),g=es.filter(e=>e.type==='gasto');
  const ing=sum(es.filter(e=>e.type==='ruta'||e.type==='extra'),entryValue);
  const porCat={};g.forEach(e=>porCat[e.cat]=(porCat[e.cat]||0)+e.amount);
  const gastos=sum(g,e=>e.amount),conTdc=sum(g.filter(e=>e.card),e=>e.amount),pagos=sum(es.filter(e=>e.type==='pago'),e=>e.amount);
  const salidas=gastos-conTdc+pagos;
  return {ing,gastos,conTdc,pagos,salidas,flujo:ing-salidas,gas:porCat.gasolina||0,rutaIng:sum(es.filter(e=>e.type==='ruta'),entryValue),porCat};
}
// ---- Auto y seguro ----
const vehPart=p=>p[3]+p[4]+p[5];
const segPart=p=>p[6]+p[7]+p[8];
const segOn=p=>!(S.settings.segCancelFrom&&p[0]>=S.settings.segCancelFrom);
const payAmt=p=>segOn(p)?p[2]:vehPart(p);
const nextPay=()=>SCHEDULE.find(p=>!S.carPaid[p[0]]);
function prevDue(p){const i=SCHEDULE.indexOf(p);return i>0?SCHEDULE[i-1][1]:addDays(p[1],-30)}
const capitalRestante=()=>Math.max(0,sum(SCHEDULE.filter(p=>!S.carPaid[p[0]]),p=>p[3])-sum(S.prepay,x=>x.amount));
function simular(B,V){const r=CAR_INFO.tasa/100/12;let n=0,int=0;while(B>0.01&&n<600){const i=B*r*1.16;int+=i;B-=Math.min(B,V-i);n++}return {meses:n,intereses:int}}
// ---- Pagos fijos y deudas: fechas ----
function startMonthFor(day){const d=new Date();return d.getDate()>day?iso(new Date(d.getFullYear(),d.getMonth()+1,1)).slice(0,7):today().slice(0,7)}
function occ(it){
  if(it.pausado)return null;
  if(it.freq==='n'){if(!it.fecha)return null;const t=today(),n=Math.max(1,+it.cada||15);let d=it.fecha;
    for(let k=0;k<400;k++){const key=`${it.id}|${d}`;if(!(key in S.billPaid))return {date:d,days:daysBetween(t,d),key};d=addDays(d,n)}return null}
  if(!it.day)return null;const t=today();let d=new Date();d=new Date(d.getFullYear(),d.getMonth(),1);
  if(it.desde){const s=pd(it.desde+'-01');if(s>d)d=s}
  for(let k=0;k<14;k++){const y=d.getFullYear(),mo=d.getMonth(),last=new Date(y,mo+1,0).getDate();
    if(it.freq!=='a'||!it.desde||mo+1===+it.desde.slice(5,7)){
      const days=it.freq==='q'?[[quinDays(it.day)[0],'a'],[Math.min(quinDays(it.day)[1],last),'b']]:[[Math.min(it.day,last),'']];
      for(const [dd,suf] of days){const date=`${y}-${pad(mo+1)}-${pad(dd)}`,key=`${it.id}|${date.slice(0,7)}${suf?'-'+suf:''}`;
        if(!(key in S.billPaid))return {date,days:daysBetween(t,date),key}}}
    d=new Date(y,mo+1,1)}
  return null;
}
const quinDays=day=>{const a=((+day-1)%15)+1;return [a,a+15]}; // quincenal: ej. 15 y 30, o 1 y 16
const FREQ={m:'mensual',q:'quincenal (días fijos)',a:'anual',n:'cada X días'};
const freqTxt=b=>b.freq==='n'?`cada ${b.cada||15} días`:FREQ[b.freq||'m']+(b.freq==='q'?` (días ${quinDays(b.day).join(' y ')})`:'')+` · día ${b.day}`;
const debtActive=d=>(+d.saldo||0)>0.5;
const debtMin=d=>Math.min(+d.saldo||0,+d.pagoMin||0);
function obligaciones(days=31){
  return [...S.bills.map(b=>({kind:'bill',it:b,amount:+b.amount||0})),...S.debts.filter(debtActive).map(d=>({kind:'debt',it:d,amount:debtMin(d)}))]
    .map(x=>({...x,o:occ(x.it)})).filter(x=>x.o&&x.o.days<=days).sort((a,b)=>a.o.days-b.o.days);
}
const billMensual=b=>b.pausado?0:b.freq==='n'?(+b.amount||0)*30/Math.max(1,+b.cada||15):(!b.desde||b.desde<=today().slice(0,7))?(b.freq==='a'?(+b.amount||0)/12:b.freq==='q'?(+b.amount||0)*2:(+b.amount||0)):0;
// ---- Promedios ----
function lastWeeks(n,cur=false){const out=[];let wk=weekKey(today());if(!cur)wk=addDays(wk,-7);for(let i=0;i<n;i++){out.push(weekData(wk));wk=addDays(wk,-7)}return out}
function avgWeekIncome(){const w=lastWeeks(4).filter(x=>x.ingreso>0);return w.length?sum(w,x=>x.ingreso)/w.length:0}
function avgWeekDiarios(){const w=lastWeeks(4).filter(x=>x.ingreso>0||x.diarios>0);return w.length?sum(w,x=>x.diarios)/w.length:0}
function fijoMensual(){const np=nextPay();return (np?payAmt(np):0)+sum(S.bills,billMensual)+sum(S.debts.filter(debtActive),debtMin)+avgWeekDiarios()*4.33}

/* ================== PLAN DE DEUDAS ================== */
const rateOf=d=>(+d.tasa||0)>0?+d.tasa:(d.type==='tdc'?60:30);
function ordenDeudas(list){
  const l=list.slice();
  if(S.settings.strategy==='bola')l.sort((a,b)=>a.saldo-b.saldo);else l.sort((a,b)=>rateOf(b)-rateOf(a)||a.saldo-b.saldo);
  return l;
}
function debtPlan(){
  const st=S.settings,inc=avgWeekIncome()*4.33,np=nextPay();
  const car=np?payAmt(np):0,bills=sum(S.bills,billMensual),diarios=avgWeekDiarios()*4.33;
  const sub=inc/payFactor(),mant=sobreBal('mant')<st.maintGoal?sub*st.maintPct/100:0,imp=sub*st.ivaPct/100*st.taxPct/100;
  const emerg=sobreBal('emerg')<st.emergMin?inc*st.emergPct/100:0;
  const budget=inc-car-bills-diarios-mant-imp-emerg;
  const act=S.debts.filter(debtActive),mins=sum(act,debtMin);
  let extra=Math.max(0,budget-mins);const orden=ordenDeudas(act);
  const alloc={};orden.forEach(d=>{const m=debtMin(d),x=Math.min(extra,d.saldo-m);alloc[d.id]=m+x;extra-=x});
  // simulación mes a mes
  let bal=act.map(d=>({d,s:+d.saldo})),meses=0,intTot=0;const pay=Math.max(0,budget);
  if(act.length&&pay>0){while(bal.some(x=>x.s>0.5)&&meses<360){bal.forEach(x=>{if(x.s>0){const i=x.s*rateOf(x.d)/100/12*1.16;x.s+=i;intTot+=i}});
    let p=pay;bal.forEach(x=>{const m=Math.min(x.s,+x.d.pagoMin||0);x.s-=m;p-=m});
    ordenDeudas(bal.filter(x=>x.s>0.5).map(x=>({...x.d,saldo:x.s,_x:x}))).forEach(o=>{const y=Math.min(Math.max(0,p),o._x.s);o._x.s-=y;p-=y});meses++}}
  return {inc,car,bills,diarios,mant,imp,emerg,budget,mins,alloc,orden,meses,intTot,total:sum(act,d=>d.saldo),act,sobra:Math.max(0,budget-sum(Object.values(alloc)))};
}

/* ================== META DE GANANCIA ================== */
// Cuánto necesitas que te deposite ML (con IVA y retenciones) para cubrir lo que vence + gasto diario + mantenimiento/impuestos
function metaGanancia(){
  const st=S.settings,t=today(),np=nextPay(),f=payFactor();
  const prop=Math.min(0.5,(st.maintPct+st.ivaPct*st.taxPct/100)/100/f); // parte del depósito que va a mantenimiento/SAT
  const obs=[];if(np)obs.push({n:`🚗 Mensualidad #${np[0]}`,a:payAmt(np),date:np[1],s:'auto'});
  obligaciones(31).forEach(x=>obs.push({n:(x.kind==='debt'?'💳 ':'📌 ')+x.it.name+(x.kind==='debt'?' (mínimo)':''),a:x.amount,date:x.o.date,s:'fijos'}));
  obs.sort((a,b)=>a.date.localeCompare(b.date));
  const bal={auto:Math.max(0,sobreBal('auto')),fijos:Math.max(0,sobreBal('fijos'))};
  obs.forEach(o=>{const u=Math.min(bal[o.s],o.a);bal[o.s]-=u;o.rest=o.a-u;o.days=daysBetween(t,o.date)});
  // con menos de 2 semanas de historial, usa también lo de la semana en curso
  const prev=lastWeeks(4).filter(w=>w.ingreso>0),cur=weekData(weekKey(t)),pocos=prev.length<2;
  const dW=pocos?Math.max(avgWeekDiarios(),cur.diarios):avgWeekDiarios(),g=x=>x/(1-prop);
  const sumW=sum(obs,o=>o.rest/(o.days<=0?1:Math.max(1,Math.ceil(o.days/7))));
  const minW=g(sumW+dW),minM=g(sum(obs.filter(o=>o.days<=30),o=>o.rest)+dW*30/7);
  let car=null;if(np){const dd=Math.max(1,daysBetween(t,np[1]));car={dd,date:np[1],need:g(sum(obs.filter(o=>o.date<=np[1]),o=>o.rest)+dW*dd/7)}}
  const ws=lastWeeks(4).filter(w=>w.dias>0),dias=ws.length>=2?Math.max(1,Math.round(sum(ws,w=>w.dias)/ws.length)):6;
  const ritmo=pocos&&cur.dias?cur.ruta/cur.dias*dias+cur.extras:avgWeekIncome(); // proyección de la semana en curso
  return {obs,dW,prop,minW,minM,car,dias,f,ritmo,estimado:pocos&&cur.dias>0};
}
function vMeta(wk){

  const lw=lvl(lleva/M.minW,1,0.6),ritmoM=M.ritmo*30/7,lm=M.ritmo?lvl(ritmoM/M.minM,1.1,0.95):'warn';
  const porDia=M.minW/M.f/M.dias;
  return `<div class="card"><h2>🎯 Cuánto necesitas ganar ${pill(lw,lw==='good'?'✅ Cubierto':'⚠️ Te faltan '+fmt0(falta))}</h2>
   <div class="grid2">
    <div class="tile"><div class="k">Meta de ingresos esta semana</div><div class="v">${fmt0(M.minW)}</div><div class="k">llevas ${fmt0(lleva)}${wk.extras?` (ML ${fmt0(wk.ruta)} + extras ${fmt0(wk.extras)})`:''}</div><div class="bar"><i style="width:${Math.min(100,lleva/M.minW*100)}%;background:${lw==='good'?'var(--good)':'var(--inc)'}"></i></div></div>
    <div class="tile"><div class="k">Ganancia por día (lo que ves en ML)</div><div class="v">${fmt0(porDia)}</div><div class="k">trabajando ${M.dias} días/semana${falta>0?` · faltan ${fmt0(falta/M.f/quedan)}/día los próximos ${quedan} días`:''}</div></div>
    <div class="tile"><div class="k">Próximos 30 días</div><div class="v">${fmt0(M.minM)}</div><div class="k">a tu ritmo${M.estimado?' (según esta semana)':''}: ${M.ritmo?fmt0(ritmoM):'—'}</div>${pill(lm,!M.ritmo?'Sin datos':lm==='good'?'✅ Alcanzas':lm==='warn'?'⚠️ Justo':'⛔ No alcanzas')}</div>
    ${M.car?`<div class="tile"><div class="k">Hasta tu pago del auto (${M.car.dd} días)</div><div class="v">${fmt0(M.car.need)}</div><div class="k">vence ${fdateS(M.car.date)}</div></div>`:''}
   </div>
   <details style="margin-top:8px"><summary class="muted">¿Cómo se calcula?</summary><div class="muted" style="margin-top:6px">
    ${M.obs.filter(o=>o.rest>0.5).map(o=>`<div class="row"><span>${esc(o.n)} · ${o.days<0?'vencido':fdateS(o.date)}</span><span>${fmt0(o.rest)}</span></div>`).join('')||'<div>Tus apartados ya cubren los pagos próximos ✅</div>'}
    <div class="row"><span>⛽🍔 Gasto diario promedio</span><span>${fmt0(M.dW)}/semana</span></div>
    <div style="margin-top:6px">Ya resta lo que tienes en los apartados de mensualidad y pagos fijos, y suma ${(M.prop*100).toFixed(0)}% para mantenimiento/impuestos. Las metas son ingresos totales: depósito de ML (ya con IVA y retenciones) + extras. "Por día" es la ganancia que ves en la app de ML antes de IVA.${M.estimado?' Con pocas semanas registradas, el ritmo se calcula con lo que llevas esta semana.':''}${M.dW?'':' Registra gasolina y comida para que la meta sea más exacta.'}</div></div></details>
   <div class="hint">Es el mínimo para no atrasarte. Lo que ganes de más va a emergencia y a bajar deudas.</div></div>`;
}

/* ================== SALUD FINANCIERA ================== */
function salud(){
  const t=today(),md=monthData(ym(t)),out=[],np=nextPay();
  if(np){const dd=daysBetween(t,np[1]),bal=sobreBal('auto'),amt=payAmt(np);
    const avance=Math.min(1,Math.max(0.05,1-dd/Math.max(1,daysBetween(prevDue(np),np[1])))),need=amt*avance;
    out.push({k:'Mensualidad del auto',l:dd<0?'bad':lvl(bal/need,1,0.7),d:dd<0?`¡Pago #${np[0]} vencido hace ${-dd} días! Hay 10% de penalización.`:`Llevas ${fmt0(bal)} de ${fmt0(amt)}. Para ir al día deberías tener ~${fmt0(need)} (faltan ${dd} días).`})}
  if(md.ing>0){const tasa=md.flujo/md.ing*100;out.push({k:'Dinero que te queda del mes',l:lvl(tasa,20,5),d:`Te queda ${tasa.toFixed(0)}% de lo que ganaste (${fmt0(md.flujo)}) después de gastos y pagos a deudas. Meta: 20% o más.`})}
  else out.push({k:'Dinero que te queda del mes',l:'warn',d:'Aún no registras ingresos este mes.'});
  if(md.rutaIng>0){const g=md.gas/md.rutaIng*100;out.push({k:'Gasolina vs ganancia de ruta',l:lvl(g,25,35,false),d:`La gasolina se come ${g.toFixed(0)}% de tu ganancia de ruta. Ideal: menos de 25%.`})}
  const comp=(np&&daysBetween(t,np[1])<=31?payAmt(np):0)+sum(obligaciones(31),x=>x.amount);
  const tot=sum(Object.keys(SOBRES).filter(k=>k!=='capital'),sobreBal);
  if(comp>0){const r=tot/comp;out.push({k:'Capital disponible',l:lvl(r,1.5,1),d:`Tienes ${fmt0(tot)} apartado contra ${fmt0(comp)} que debes pagar en 30 días (${(r*100).toFixed(0)}%).${r<1?' Capital bajo: no cubres tus compromisos.':''}`})}
  const act=S.debts.filter(debtActive);
  if(act.length){const inc=avgWeekIncome()*4.33||md.ing,mins=sum(act,debtMin),r=inc?mins/inc*100:100;
    const lim=sum(act.filter(d=>d.limite>0),d=>d.limite),uso=lim?sum(act.filter(d=>d.limite>0),d=>d.saldo)/lim*100:0;
    const venc=obligaciones(0).filter(x=>x.kind==='debt'&&x.o.days<0);
    out.push({k:'Deudas (TDC y préstamos)',l:worst(lvl(r,15,30,false),lim?lvl(uso,30,70,false):'good',venc.length?'bad':'good'),
      d:`Debes ${fmt0(sum(act,d=>d.saldo))}. Los mínimos son ${r.toFixed(0)}% de tu ingreso${lim?`; usas ${uso.toFixed(0)}% de tus líneas (ideal <30%)`:''}.${venc.length?' Vencido: '+venc.map(x=>x.it.name).join(', '):''}`})}
  const fm=fijoMensual(),em=sobreBal('emerg'),meses=fm>0?em/fm:0;
  out.push({k:'Fondo de emergencia',l:em<S.settings.emergMin?'bad':lvl(meses,S.settings.emergMonths,1),d:`${fmt0(em)} = ${meses.toFixed(1)} meses de gastos fijos. Mínimo ${fmt0(S.settings.emergMin)} ya; meta ${S.settings.emergMonths} meses cuando liquides las TDC.`});
  const vb=obligaciones(0).filter(x=>x.kind==='bill'&&x.o.days<0);
  if(S.bills.length)out.push({k:'Pagos fijos',l:vb.length?'bad':'good',d:vb.length?'Vencido: '+vb.map(x=>x.it.name).join(', '):'Sin pagos vencidos.'});
  const score=sum(out,x=>x.l==='good'?2:x.l==='warn'?1:0)/(out.length*2);
  return {items:out,score,general:score>=0.75&&!out.some(x=>x.l==='bad')?'good':score>=0.45?'warn':'bad'};
}

/* ================== APARTADOS SEMANALES ================== */
function recomendar(wk){
  const w=weekData(wk),st=S.settings,t=today();
  let W=w.ingreso,estimado=false;if(W<=0){W=avgWeekIncome();estimado=true}
  const sub=w.sub>0?w.sub:W/payFactor(),iva=sub*st.ivaPct/100,items=[],np=nextPay();
  if(np){const dd=daysBetween(t,np[1]),amt=payAmt(np),faltan=Math.max(0,amt-sobreBal('auto')),sem=Math.max(1,Math.ceil(dd/7));
    items.push({k:'auto',v:dd<=0?faltan:faltan/sem,why:`Faltan ${fmt0(faltan)} para el pago #${np[0]} (${fdate(np[1])}); ${sem} semana(s). Va primero.`})}
  let bal=sobreBal('fijos'),vf=0;
  obligaciones(31).forEach(({amount,o})=>{let a=amount;const u=Math.min(bal,a);bal-=u;a-=u;vf+=a/Math.max(1,Math.ceil(o.days/7))});
  items.push({k:'fijos',v:vf,why:(S.bills.length||S.debts.some(debtActive))?'Pagos mínimos de TDC/préstamos y pagos fijos del próximo mes.':'Captura tus deudas en la pestaña Deudas.'});
  items.push({k:'imp',v:iva*st.taxPct/100,why:st.taxPct?`${st.taxPct}% del IVA trasladado (${fmt0(iva)}).`:'Configura en Ajustes si debes guardar parte del IVA.'});
  const mb=sobreBal('mant');
  items.push({k:'mant',v:mb<st.maintGoal?sub*st.maintPct/100:0,why:mb<st.maintGoal?`${st.maintPct}% de la ruta. Llevas ${fmt0(mb)} de ${fmt0(st.maintGoal)}.`:'¡Meta alcanzada!'});
  const diarios=w.diarios>0?w.diarios:avgWeekDiarios();
  const hayDeuda=S.debts.some(debtActive),fm=fijoMensual(),target=hayDeuda?st.emergMin:fm*st.emergMonths,eb=sobreBal('emerg');
  let ve=eb<target?Math.min(target-eb,W*st.emergPct/100):0;
  let left=W-sum(items,x=>x.v)-diarios-ve;
  const autoOk=!np||sobreBal('auto')>=payAmt(np)*0.7||daysBetween(t,np[1])>20;
  let vc=0,whyC='';
  if(eb>=Math.min(st.emergMin,target)&&autoOk&&left>0){vc=left*st.abonoPct/100;const top=ordenDeudas(S.debts.filter(debtActive))[0];
    whyC=top?`${st.abonoPct}% de lo que sobra → abónalo a <b>${esc(top.name)}</b> (${S.settings.strategy==='bola'?'saldo más chico':'tasa más alta'}).`:`${st.abonoPct}% de lo que sobra → abono a capital del auto (ya no tienes TDC).`}
  else{whyC=eb<st.emergMin?`Primero junta tu fondo mínimo de ${fmt0(st.emergMin)}.`:left<=0?'Esta semana no sobra.':'Primero completa la mensualidad.';if(left>0&&eb<target)ve+=Math.min(target-eb-ve,left*0.5)}
  items.push({k:'emerg',v:Math.max(0,ve),why:`Meta ${hayDeuda?'mínima (mientras tengas TDC)':st.emergMonths+' meses'}: ${fmt0(target)}. Llevas ${fmt0(eb)}.`});
  items.push({k:'capital',v:vc,why:whyC});
  const total=sum(items,x=>x.v);
  return {W,estimado,items,diarios,libre:W-total-diarios,total,w};
}

function drawChart(){
  const el=document.getElementById('chart');if(!el)return;
  const ws=lastWeeks(8,true).reverse(),W=Math.min(600,el.clientWidth||330),H=170,pl=44,pb=22,pt=8;
  const max=Math.max(1,...ws.map(w=>Math.max(w.ingreso,w.salidas))),nice=Math.pow(10,Math.floor(Math.log10(max))),top=Math.ceil(max/nice)*nice;
  const gw=(W-pl)/ws.length,bw=Math.min(16,(gw-8)/2),y=v=>pt+(H-pt-pb)*(1-v/top);
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y salidas por semana">`;
  [0,.5,1].forEach(f=>{const v=top*f;s+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#2b3340"/><text x="${pl-6}" y="${y(v)+4}" fill="#8b8a83" font-size="10" text-anchor="end">${v>=1000?(v/1000).toFixed(v%1000?1:0)+'k':v}</text>`});
  const bar=(x,v,c)=>{if(v<=0)return '';const h=Math.max(2,y(0)-y(v)),r=Math.min(4,bw/2,h),yt=y(v);return `<path d="M${x},${y(0)} V${yt+r} Q${x},${yt} ${x+r},${yt} H${x+bw-r} Q${x+bw},${yt} ${x+bw},${yt+r} V${y(0)} Z" fill="${c}"/>`};
  ws.forEach((w,i)=>{const cx=pl+gw*i+gw/2,d=pd(w.wk);
    s+=bar(cx-bw-1,w.ingreso,'#3987e5')+bar(cx+1,w.salidas,'#d95926')+`<text x="${cx}" y="${H-6}" fill="#8b8a83" font-size="10" text-anchor="middle">${d.getDate()}/${d.getMonth()+1}</text>`;
    s+=`<rect x="${pl+gw*i}" y="0" width="${gw}" height="${H-pb}" fill="transparent" data-tip="Semana ${fdateS(w.wk)}|Ingresos ${fmt0(w.ingreso)}|Salidas ${fmt0(w.salidas)}|Neto ${fmt0(w.ingreso-w.salidas)}"/>`});
  el.innerHTML=s+'</svg>';
  const tip=document.getElementById('tip');
  el.querySelectorAll('[data-tip]').forEach(r=>{const show=e=>{const p=e.touches?e.touches[0]:e;tip.innerHTML=r.dataset.tip.split('|').join('<br>');tip.style.display='block';tip.style.left=Math.min(innerWidth-160,p.clientX+10)+'px';tip.style.top=(p.clientY-70)+'px'};
    r.addEventListener('mousemove',show);r.addEventListener('touchstart',show,{passive:true});r.addEventListener('mouseleave',()=>tip.style.display='none')});
}

let SC=null;try{SC=JSON.parse(localStorage.getItem(SKEY))}catch(e){}
const saveSC=()=>SC?localStorage.setItem(SKEY,JSON.stringify(SC)):localStorage.removeItem(SKEY);
let syncing=false,again=false,syncTimer=null;
function scheduleSync(){if(!SC)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(),1500)}
async function rpc(fn,body){
  const h={'apikey':SC.k,'Content-Type':'application/json'};if(!SC.k.startsWith('sb_'))h.Authorization='Bearer '+SC.k;
  const r=await fetch(SC.u.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body)});
  if(!r.ok)throw new Error(r.status+': '+(await r.text()).slice(0,140));const t=await r.text();return t&&t!=='null'?JSON.parse(t):null;
}
async function sync(manual){
  if(!SC)return;if(syncing){again=true;return}syncing=true;SC.state='…';updSyncBadge();
  try{
    const remote=await rpc('get_state',{p_code:SC.c}),before=JSON.stringify(S);
    if(remote&&remote.entries)S=merge(S,remote);
    localStorage.setItem(KEY,JSON.stringify(S));
    await rpc('put_state',{p_code:SC.c,p_data:S});
    SC.last=Date.now();SC.err='';if(JSON.stringify(S)!==before)softRender();
  }catch(e){SC.err=String(e.message||e)}
  finally{SC.state='';saveSC();syncing=false;updSyncBadge();if(manual)toast(SC.err?'⚠️ No se pudo sincronizar':'☁️ Sincronizado');if(TAB==='ajustes'&&manual)softRender();if(again){again=false;sync()}}
}
function updSyncBadge(){const b=document.getElementById('syncBadge');if(!SC){b.textContent='';return}
  b.textContent=SC.state==='…'?'☁️ …':SC.err?'☁️⚠️':'☁️✓';b.title=SC.err||('Última sincronización '+(SC.last?new Date(SC.last).toLocaleTimeString('es-MX'):'—'))}
// Lee URL y clave de Supabase aunque vengan con formato de WhatsApp, espacios o caracteres invisibles
function parseSupa(raw){
  const t=raw.normalize('NFKC').replace(/[\u200B-\u200F\u2028-\u202F\u2060\uFEFF]/g,'').replace(/[\u201C\u201D\u2018\u2019\x22\x27\x60*~]/g,'');
  let u=(t.match(/https?:\/\/\s*([a-z0-9]{8,})\s*\.\s*supabase\s*\.\s*co/i)||[])[1];
  if(!u){const m=t.match(/([a-z0-9]{15,})\.supabase\.co/i);u=m&&m[1]}
  u=u?`https://${u.toLowerCase()}.supabase.co`:'';
  let k=(t.match(/sb_publishable_[A-Za-z0-9_-]{10,}/)||t.match(/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/)||[])[0];
  if(!k){const m=t.match(/sb_?publishable_?([A-Za-z0-9_-]{10,})/i);if(m)k='sb_publishable_'+m[1]} // guiones bajos perdidos
  if(!k){const line=t.split(/\n/).find(l=>/KEY\s*=/.test(l));if(line){const v=line.split('=').slice(1).join('=').replace(/\s+/g,'');if(v.length>=20)k=v}}
  if(!k){const v=document.getElementById('sbKey').value.replace(/\s+/g,'');if(v.length>=20)k=v}
  return {u,k:k||''};
}
const encKey=o=>'FR1.'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const decKey=s=>{const b=(s.split('FR1.').pop()||'').replace(/[^A-Za-z0-9+/=]/g,'');return JSON.parse(decodeURIComponent(escape(atob(b))))}; // ignora espacios/caracteres invisibles
function newCode(){const a=new Uint8Array(24);crypto.getRandomValues(a);return [...a].map(x=>'abcdefghijkmnpqrstuvwxyz23456789'[x%32]).join('')}

const SQL=`create table if not exists public.finanzas_sync (code text primary key, data jsonb not null, updated_at timestamptz not null default now());
alter table public.finanzas_sync enable row level security;
create or replace function public.get_state(p_code text) returns jsonb language sql security definer set search_path = public as $$ select data from public.finanzas_sync where code = p_code and length(p_code) >= 24; $$;
create or replace function public.put_state(p_code text, p_data jsonb) returns void language plpgsql security definer set search_path = public as $$ begin if length(p_code) < 24 then raise exception 'codigo invalido'; end if; insert into public.finanzas_sync(code, data, updated_at) values (p_code, p_data, now()) on conflict (code) do update set data = excluded.data, updated_at = now(); end $$;
revoke all on function public.get_state(text) from public; revoke all on function public.put_state(text, jsonb) from public;
grant execute on function public.get_state(text) to anon, authenticated; grant execute on function public.put_state(text, jsonb) to anon, authenticated;`;
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch(e){openDlg(`<h2 style="margin-top:0">Copia este texto</h2><textarea rows="8" readonly onclick="this.select()">${esc(t)}</textarea><button class="btn full" data-close>Cerrar</button>`)}}
async function activarSync(cfg,msgOk){
  SC=Object.assign({last:0,err:''},cfg);saveSC();await sync();
  if(SC.err){const e=SC.err;SC=null;saveSC();alert('No se pudo conectar: '+e+'\n\nRevisa la URL, la clave y que hayas corrido el SQL.');render();return}
  toast(msgOk);render();
}

   <div><label>Día límite de pago</label><input name="day" type="number" min="0" max="31" value="${d.day||''}" placeholder="1-31"></div>
   <div><label>Pago mínimo / mensualidad</label><input name="pagoMin" type="number" step="0.01" inputmode="decimal" value="${d.pagoMin||''}"></div>
   <div><label>Pago p/ no generar intereses</label><input name="pagoNoInt" type="number" step="0.01" inputmode="decimal" value="${d.pagoNoInt||''}"></div>
   <div><label>Tasa anual % (opcional)</label><input name="tasa" type="number" step="0.01" inputmode="decimal" value="${d.tasa||''}"></div>
   <div><label>Límite de crédito (opcional)</label><input name="limite" type="number" step="1" inputmode="decimal" value="${d.limite||''}"></div></div>
   <div class="hint">Todo viene en tu estado de cuenta o en la app del banco. La tasa sirve para saber cuál te cobra más.</div>
   ${dlgBtns(id?`<button type="button" class="btn danger" id="delDebtBtn">🗑️</button>`:'')}</form>`,f=>{
    const o={id:id||uid(),name:f.name,type:f.type,saldo:+f.saldo||0,day:Math.min(31,+f.day||0),pagoMin:+f.pagoMin||0,pagoNoInt:+f.pagoNoInt||0,tasa:+f.tasa||0,limite:+f.limite||0};
    if(o.day&&(!d.desde||+d.day!==o.day))o.desde=startMonthFor(o.day);else if(d.desde)o.desde=d.desde;
    if(id){Object.assign(d,o);upd('debts',d)}else add('debts',o);
  });
  const del=document.getElementById('delDebtBtn');if(del)del.onclick=()=>{if(confirm(`¿Eliminar ${d.name}? (los pagos ya registrados se quedan en tus movimientos)`)){rem('debts',id);dlg.close();save();render()}};
}
function editBill(id,preset){
  const b=S.bills.find(x=>x.id===id)||Object.assign({name:'',type:'fijo',day:'',amount:'',freq:'m',desde:''},preset);
  openDlg(`<form><h2 style="margin-top:0">${id?'Editar':'Nuevo'} ${b.type==='seguro'?'seguro':'pago fijo'}</h2>
   <label>Nombre</label><input name="name" value="${esc(b.name)}" placeholder="Ej. Telcel, renta, seguro de plataforma…" required>
   <label>Tipo</label><select name="type"><option value="fijo" ${b.type!=='seguro'?'selected':''}>Pago fijo / servicio</option><option value="seguro" ${b.type==='seguro'?'selected':''}>Seguro</option></select>
   <div class="grid2"><div><label>Monto</label><input name="amount" type="number" step="0.01" value="${b.amount}" required></div>
   <div><label>Frecuencia</label><select name="freq" id="freqSel"><option value="m" ${!b.freq||b.freq==='m'?'selected':''}>Mensual</option><option value="n" ${b.freq==='n'?'selected':''}>Cada X días</option><option value="q" ${b.freq==='q'?'selected':''}>Quincenal (15 y 30)</option><option value="a" ${b.freq==='a'?'selected':''}>Anual</option></select></div></div>
   <div class="grid2 fN"><div><label>Próximo pago</label><input name="fecha" type="date" value="${b.fecha||today()}"></div>
   <div><label>Cada cuántos días</label><input name="cada" type="number" min="1" value="${b.cada||15}"></div></div>
   <div class="grid2 fD"><div><label>Día de pago</label><input name="day" type="number" min="1" max="31" value="${b.day}"></div>
   <div><label>Empieza en</label><input name="desde" type="month" value="${b.desde||''}"></div></div>
   <div class="hint fN">"Cada X días": recargas que vencen cada 15/30 días contados desde la última.</div>
   <div class="hint fD">"Empieza en" sirve para pagos futuros (ej. el seguro de plataforma desde feb–mar 2027). Si es anual, ese mes se repite cada año.</div>
   <label class="check"><input type="checkbox" name="pausado" ${b.pausado?'checked':''}> En pausa (no lo uso por ahora, no recordar)</label>
   ${dlgBtns(id?`<button type="button" class="btn danger" id="delBillBtn">🗑️</button>`:'')}</form>`,f=>{
    if(f.freq!=='n'&&!(+f.day))return alert('Pon el día de pago'),false;
    const day=Math.min(31,+f.day||1),o={id:id||uid(),name:f.name,type:f.type,day,amount:+f.amount||0,freq:f.freq,pausado:!!f.pausado,
      fecha:f.fecha||today(),cada:Math.max(1,+f.cada||15),desde:f.desde||(f.freq==='a'?startMonthFor(day):(id?b.desde:startMonthFor(day)))};
    if(id){Object.assign(b,o);upd('bills',b)}else add('bills',o);
  });
  const fs=document.getElementById('freqSel'),tog=()=>{const n=fs.value==='n';dlg.querySelectorAll('.fN').forEach(e=>e.style.display=n?'':'none');dlg.querySelectorAll('.fD').forEach(e=>e.style.display=n?'none':'')};fs.onchange=tog;tog();
  const del=document.getElementById('delBillBtn');if(del)del.onclick=()=>{if(confirm('¿Eliminar este pago?')){rem('bills',id);dlg.close();save();render()}};
}
function ajSobre(k){
  openDlg(`<form><h2 style="margin-top:0">${SOBRES[k].e} ${SOBRES[k].n}</h2><div class="muted">Saldo actual ${fmt(sobreBal(k))}</div>
   <label>Movimiento</label><select name="dir"><option value="1">Depositar (+)</option><option value="-1">Retirar (−)</option><option value="0">Fijar saldo exacto</option></select>
   <label>Monto</label><input type="number" step="0.01" name="amount" required><label>Nota</label><input name="note" placeholder="Opcional">${dlgBtns()}</form>`,d=>{
    let a=+d.amount||0;if(d.dir==='0')a=a-sobreBal(k);else a*=+d.dir;
    add('moves',{id:uid(),date:today(),sobre:k,amount:a,note:d.note||(d.dir==='0'?'Ajuste de saldo':'')});
  });
}
function prepay(){
  openDlg(`<form><h2 style="margin-top:0">Abono a capital realizado</h2>
   <label>Monto abonado</label><input type="number" step="0.01" name="amount" value="${Math.max(0,Math.round(sobreBal('capital')))||''}" required>
   <label>Fecha</label><input type="date" name="date" value="${today()}">${sobreSelect('capital')}${dlgBtns()}</form>`,d=>{
    const a=+d.amount||0,id=uid();add('prepay',{id,date:d.date,amount:a});takeFromSobre(d.from,a,d.date,'Abono a capital auto',id);toast('¡Abono registrado! Menos intereses 💪');
  });
}
function editReal(wk){
  const w=weekData(wk);
  openDlg(`<form><h2 style="margin-top:0">Depósito real de ML</h2><div class="muted">Semana ${fdateS(wk)} · esperado ${fmt(w.esperado)}</div>
   <label>Monto que te depositaron</label><input type="number" step="0.01" name="real" value="${w.real??''}" placeholder="Vacío = usar el esperado">${dlgBtns()}</form>`,d=>{
    if(d.real==='')mdel('weekReal',wk);else mset('weekReal',wk,+d.real);
  });
}

/* ================== EXPORTAR ================== */
function download(name,content,type){
  const blob=new Blob([content],{type}),f=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[f]})&&/iphone|ipad|android/i.test(navigator.userAgent)){navigator.share({files:[f],title:name}).catch(()=>{});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function exportICS(){
  const st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',D=s=>s.replace(/-/g,'');
  let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//FinanzasRuta//ES\r\nCALSCALE:GREGORIAN\r\n';
  const ev=(uid,date,title,desc,rrule,alarms)=>{s+=`BEGIN:VEVENT\r\nUID:${uid}@finanzasruta\r\nDTSTAMP:${st}\r\nDTSTART;VALUE=DATE:${D(date)}\r\nDTEND;VALUE=DATE:${D(addDays(date,1))}\r\n${rrule?rrule+'\r\n':''}SUMMARY:${title}\r\n${desc?'DESCRIPTION:'+desc+'\r\n':''}${alarms.map(([t,m])=>`BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${m}\r\nTRIGGER:${t}\r\nEND:VALARM\r\n`).join('')}END:VEVENT\r\n`};
  SCHEDULE.filter(p=>!S.carPaid[p[0]]).forEach(p=>ev('auto-pago-'+p[0],p[1],`🚗 Mensualidad auto #${p[0]} - ${fmt(payAmt(p))}`,`Pago ${p[0]} de 60. Penalización 10% por pago tardío.`,'',[['-P3DT0H','Mensualidad en 3 días'],['-PT15H','Mensualidad mañana']]));
  [...S.debts.filter(debtActive),...S.bills].forEach(it=>{const o=occ(it);if(!o)return;
    ev('pago-'+it.id,o.date,`${it.type==='tdc'?'💳':it.type==='seguro'?'🛡️':'📌'} Pagar ${it.name}`,'',it.freq==='n'?`RRULE:FREQ=DAILY;INTERVAL=${Math.max(1,+it.cada||15)}`:it.freq==='a'?'RRULE:FREQ=YEARLY':it.freq==='q'?`RRULE:FREQ=MONTHLY;BYMONTHDAY=${quinDays(it.day)[0]},${Math.min(quinDays(it.day)[1],28)}`:`RRULE:FREQ=MONTHLY;BYMONTHDAY=${Math.min(it.day,28)}`,[['-P2D','Pago en 2 días'],['-PT15H','Pago mañana']])});
  download('pagos.ics',s+'END:VCALENDAR\r\n','text/calendar');
}
function exportCSV(){
  const rows=[['Fecha','Tipo','Categoría','Monto','Con IVA','Km','Paquetes','Litros','Nota','Tarjeta','Apartado']];
  S.entries.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>rows.push([e.date,e.type,e.type==='gasto'?(GASTO_CATS[e.cat]||e.cat).replace(/^\S+\s/,''):e.type==='pago'?debtName(e.debt)||'':'',e.amount,e.type==='ruta'?entryValue(e).toFixed(2):'',e.km||'',e.paq||'',e.lts||'',e.note||'',e.card?debtName(e.card)||'':'',e.from?SOBRES[e.from].n:'']));
  download('movimientos.csv','\ufeff'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n'),'text/csv');
}

/* ================== EVENTOS ================== */
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)};
function delEntry(id){
  const e=S.entries.find(x=>x.id===id);if(!e)return;
  const d=S.debts.find(x=>x.id===(e.card||e.debt));
  if(d&&e.card){d.saldo=Math.max(0,(+d.saldo||0)-e.amount);upd('debts',d)}
  if(d&&e.type==='pago'){d.saldo=(+d.saldo||0)+e.amount;upd('debts',d)}
  S.moves.filter(m=>m.ref===id).forEach(m=>rem('moves',m.id));
  rem('entries',id);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.act,d=b.dataset;
  const acts={
    tab:()=>setTab(d.t),tipo:()=>{nuevoTipo=d.k;render()},cat:()=>{gastoCat=d.k;render()},
    pagarAuto:()=>pagarAuto(+d.n),
    unpay:()=>{if(confirm(`¿Desmarcar pago #${d.n}? (no borra el gasto registrado)`)){mdel('carPaid',d.n);save();render()}},
    pagarBill:()=>pagarBill(d.id),editBill:()=>editBill(d.id),
    pausa:()=>{const b=S.bills.find(x=>x.id===d.id);b.pausado=!b.pausado;upd('bills',b);save();render();toast(b.pausado?'⏸️ En pausa: no te lo recordará':'▶️ Reanudado')},
    addSeguro:()=>editBill(null,{name:'Seguro de plataforma',type:'seguro',freq:'m',desde:'2027-02'}),
    pagarDebt:()=>pagarDebt(d.id),editDebt:()=>editDebt(d.id),
    strat:()=>{S.settings.strategy=d.k;S.meta.settings=now();save();render()},
    delEntry:()=>{if(confirm('¿Borrar este registro?')){delEntry(d.id);save();render()}},
    delMove:()=>{if(confirm('¿Borrar este movimiento del apartado?')){rem('moves',d.id);save();render()}},
    mes:()=>{const[y,m]=movMonth.split('-').map(Number),dt=new Date(y,m-1+(+d.d),1);movMonth=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}`;render()},
    movf:()=>{movFilter=d.k;render()},real:()=>editReal(d.wk),aw:()=>{aptWeek=addDays(aptWeek,+d.d);render()},
    aplicar:()=>{const note='Apartado semana '+fdateS(d.wk);if(S.moves.some(m=>m.note===note)&&!confirm('Ya registraste los apartados de esta semana. ¿Registrarlos otra vez?'))return;
      recomendar(d.wk).items.filter(i=>i.v>0.5).forEach(i=>add('moves',{id:uid(),date:today(),sobre:i.k,amount:Math.round(i.v),note}));save();render();toast('Apartados registrados 🐷')},
    ajSobre:()=>ajSobre(d.k),prepay,ics:exportICS,csv:exportCSV,
    export:()=>download(`respaldo-finanzas-${today()}.json`,JSON.stringify(S),'application/json'),
    reset:()=>{if(confirm('¿Borrar TODOS los datos de este celular? Descarga un respaldo primero.')&&confirm('¿Seguro?')){const sc=SC;SC=null;saveSC();S=normalize(null);localStorage.setItem(KEY,JSON.stringify(S));if(sc&&confirm('¿También desconectar la sincronización? (si no, al sincronizar volverán tus datos de la nube)')){}else if(sc){SC=sc;saveSC()}setTab('inicio')}},
    syncNow:()=>{if(SC)sync(true);else setTab('ajustes')},
    copySQL:()=>copyText(SQL,'Código SQL copiado'),
    copyKey:()=>copyText(encKey({u:SC.u,k:SC.k,c:SC.c}),'Clave copiada: pégala en tu otro celular'),
    unsync:()=>{if(confirm('¿Desconectar este celular? Tus datos se quedan aquí, pero ya no se sincronizarán.')){SC=null;saveSC();render()}},
    activar:()=>{const raw=document.getElementById('sbUrl').value+'\n'+document.getElementById('sbKey').value;
      if(/sb_secret_|sbsecret|service_role/i.test(raw))return alert('Esa es la clave secreta de administrador. Usa la "publishable" o "anon".');
      const {u,k}=parseSupa(raw);
      if(!u||!k)return alert(`No pude leer ${!u&&!k?'la URL ni la clave':!u?'la URL':'la clave'}.\n\nURL detectada: ${u||'—'}\nClave detectada: ${k?k.slice(0,18)+'…':'—'}\n\nTip: copia cada valor por separado (pon la URL en el primer campo y la clave en el segundo), sin pasarlo por WhatsApp. Puedes entrar a supabase.com desde Safari → Project Settings → API Keys.`);
      activarSync({u,k,c:newCode()},'☁️ ¡Sincronización activada! Ahora copia la clave al otro celular')},
    unirme:()=>{let o;try{o=decKey(document.getElementById('joinKey').value);if(!o.u||!o.k||!o.c)throw 0}catch(_){return alert('Esa clave no es válida.')}activarSync(o,'☁️ ¡Celular unido! Datos combinados')}
  };
  acts[a]&&acts[a]();
});
document.addEventListener('submit',e=>{
  if(e.target.id==='fNuevo'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
    const en={id:uid(),date:d.date,type:nuevoTipo,amount:+d.amount};
    if(!(en.amount>0))return toast('Escribe un monto');
    if(nuevoTipo==='ruta'){if(d.km)en.km=+d.km;if(d.paq)en.paq=+d.paq}
    if(d.note)en.note=d.note;
    if(nuevoTipo==='gasto'){en.cat=gastoCat;if(d.lts)en.lts=+d.lts;
      if(d.card){en.card=d.card;const c=S.debts.find(x=>x.id===d.card);c.saldo=(+c.saldo||0)+en.amount;upd('debts',c)}
      else if(d.from){en.from=d.from;takeFromSobre(d.from,en.amount,d.date,GASTO_CATS[gastoCat].replace(/^\S+\s/,'')+(d.note?' · '+d.note:''),en.id)}}
    add('entries',en);save();render();toast('Guardado ✔');
  }
  if(e.target.id==='fSet'){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));for(const k in d)S.settings[k]=+d[k];S.meta.settings=now();save();toast('Ajustes guardados');render()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='segSel'){S.settings.segCancelFrom=+e.target.value;S.meta.settings=now();save();render();toast(S.settings.segCancelFrom?'Mensualidades ajustadas sin seguro':'Seguro original activo')}
  if(e.target.id==='impFile'){const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.entries)throw 0;if(confirm('¿Combinar este respaldo con tus datos actuales?')){S=merge(S,o);save();setTab('inicio');toast('Respaldo restaurado')}}catch(_){alert('Archivo no válido')}})}
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pendingRender&&!dlg.open&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))render()},300));
window.addEventListener('resize',()=>{if(TAB==='inicio')drawChart()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){sync();if(TAB==='inicio')softRender()}});
setInterval(()=>{if(document.visibilityState==='visible')sync()},60000);
window.addEventListener('online',()=>sync());

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
render();sync();
</script>
